<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Lab — Three.js Donut</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 3, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;

        // Pastel colors
        const pastelColors = [
            0xFFB3BA, // pink
            0xFFDFBA, // peach
            0xFFFFBA, // yellow
            0xBAFFC9, // mint
            0xBAE1FF, // sky blue
            0xE8BAFF, // lavender
        ];

        // Donut geometry
        const donutGeometry = new THREE.TorusGeometry(1.5, 0.6, 32, 100);

        // Donut with gradient-like material
        const donutMaterial = new THREE.MeshStandardMaterial({
            color: 0xFFB3BA,
            metalness: 0.1,
            roughness: 0.4,
            emissive: 0x332233,
            emissiveIntensity: 0.15,
        });

        const donut = new THREE.Mesh(donutGeometry, donutMaterial);
        donut.rotation.x = Math.PI * 0.3;
        scene.add(donut);

        // Sprinkles on the donut
        const sprinkleGroup = new THREE.Group();
        const sprinkleGeometry = new THREE.CylinderGeometry(0.02, 0.02, 0.15, 6);

        for (let i = 0; i < 200; i++) {
            const sprinkleMaterial = new THREE.MeshStandardMaterial({
                color: pastelColors[Math.floor(Math.random() * pastelColors.length)],
                metalness: 0.3,
                roughness: 0.2,
            });
            const sprinkle = new THREE.Mesh(sprinkleGeometry, sprinkleMaterial);

            // Place on donut surface
            const angle = Math.random() * Math.PI * 2;
            const tubeAngle = Math.random() * Math.PI * 2;
            const R = 1.5; // major radius
            const r = 0.6; // minor radius
            const surfaceOffset = 0.08; // slightly above surface

            sprinkle.position.x = (R + r * Math.cos(tubeAngle) + surfaceOffset) * Math.cos(angle);
            sprinkle.position.y = (R + r * Math.cos(tubeAngle) + surfaceOffset) * Math.sin(angle) * 0.3;
            sprinkle.position.z = (R + r * Math.cos(tubeAngle) + surfaceOffset) * Math.sin(angle);

            sprinkle.position.y += r * Math.sin(tubeAngle);

            // Rotate sprinkle to align with surface
            sprinkle.rotation.x = Math.random() * Math.PI;
            sprinkle.rotation.z = Math.random() * Math.PI;

            sprinkleGroup.add(sprinkle);
        }
        donut.add(sprinkleGroup);

        // Glaze drip effect
        const dripGeometry = new THREE.SphereGeometry(0.12, 16, 16);
        dripGeometry.scale(1, 2, 1);
        const dripMaterial = new THREE.MeshStandardMaterial({
            color: 0xFFB3BA,
            metalness: 0.1,
            roughness: 0.3,
            transparent: true,
            opacity: 0.9,
        });

        for (let i = 0; i < 8; i++) {
            const drip = new THREE.Mesh(dripGeometry, dripMaterial.clone());
            drip.material.color.setHex(pastelColors[i % pastelColors.length]);

            const angle = (i / 8) * Math.PI * 2 + Math.random() * 0.5;
            drip.position.x = 1.5 * Math.cos(angle);
            drip.position.z = 1.5 * Math.sin(angle);
            drip.position.y = -0.4 + Math.random() * 0.2;

            drip.scale.set(
                0.5 + Math.random() * 0.5,
                0.5 + Math.random() * 1.5,
                0.5 + Math.random() * 0.5
            );

            scene.add(drip);
        }

        // Floor / platform
        const floorGeometry = new THREE.CylinderGeometry(3, 3, 0.1, 64);
        const floorMaterial = new THREE.MeshStandardMaterial({
            color: 0x2d2d44,
            metalness: 0.5,
            roughness: 0.3,
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.position.y = -1.5;
        scene.add(floor);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404060, 0.8);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffeedd, 1.5);
        mainLight.position.set(5, 8, 5);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0xbae1ff, 0.5);
        fillLight.position.set(-5, 3, -5);
        scene.add(fillLight);

        const rimLight = new THREE.PointLight(0xe8baff, 1, 20);
        rimLight.position.set(0, -2, 5);
        scene.add(rimLight);

        // Floating pastel particles
        const particleCount = 100;
        const particleGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const particleColors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 10;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 8;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 10;

            const color = new THREE.Color(pastelColors[Math.floor(Math.random() * pastelColors.length)]);
            particleColors[i * 3] = color.r;
            particleColors[i * 3 + 1] = color.g;
            particleColors[i * 3 + 2] = color.b;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.7,
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // Animation
        function animate() {
            requestAnimationFrame(animate);

            // Gentle donut rotation
            donut.rotation.z += 0.002;

            // Float particles
            const posArray = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                posArray[i * 3 + 1] += 0.002;
                if (posArray[i * 3 + 1] > 4) posArray[i * 3 + 1] = -4;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Responsive
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
