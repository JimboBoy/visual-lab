<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Lab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            padding: 40px;
            min-height: 100vh;
        }
        h1 { font-size: 2em; margin-bottom: 10px; }
        h1 span { color: #ff6b9d; }
        p.subtitle { color: #888; margin-bottom: 40px; font-size: 0.9em; }
        .ideas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 900px;
        }
        .idea-card {
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .idea-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(255,107,157,0.2);
        }
        .idea-preview {
            width: 100%;
            height: 180px;
            background-size: cover;
            background-position: center;
        }
        .idea-info {
            padding: 16px;
        }
        .idea-info h2 { font-size: 1.1em; margin-bottom: 6px; }
        .idea-info p { font-size: 0.85em; color: #aaa; }
        .tag {
            display: inline-block;
            background: rgba(255,107,157,0.15);
            color: #ff6b9d;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h1>Visual <span>Lab</span></h1>
    <p class="subtitle">Creative coding experiments · Branch per idea</p>
    <div class="ideas">
        <a class="idea-card" href="./first-sketch/">
            <div class="idea-preview" style="background: linear-gradient(135deg, #ffb3ba, #ffd700, #baffc9, #bae1ff, #e8baff);"></div>
            <div class="idea-info">
                <h2>🍩 Pastel Donut</h2>
                <p>Three.js donut with sprinkles, pastel colors and floating particles</p>
                <span class="tag">three.js</span> <span class="tag">mesh-standard</span>
            </div>
        </a>
        <a class="idea-card" href="./nebula-gradient/">
            <div class="idea-preview" style="background: linear-gradient(135deg, #ff6b9d, #c44dff, #4dabf7, #51cf66, #ffd43b, #ff922b);"></div>
            <div class="idea-info">
                <h2>🌀 Nebula Blob</h2>
                <p>Morphing blob with simplex noise, iridescent shader and cloud patterns</p>
                <span class="tag">three.js</span> <span class="tag">shader</span>
            </div>
        </a>
    </div>
</body>
</html>
