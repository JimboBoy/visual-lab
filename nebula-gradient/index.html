<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Lab — Nebula Blob</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0a0a1a; }
        canvas { display: block; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-family: 'Helvetica Neue', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="info">drag to rotate · scroll to zoom</div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.minDistance = 3;
        controls.maxDistance = 10;

        // Nebula gradient + noise shader
        const vertexShader = `
            uniform float uTime;
            uniform float uNoiseStrength;
            uniform float uNoiseSpeed;
            varying vec3 vPosition;
            varying vec3 vNormal;
            varying vec2 vUv;

            // Simplex 3D noise
            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}

            float snoise(vec3 v){
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod(i, 289.0);
                vec4 p = permute(permute(permute(
                    i.z + vec4(0.0, i1.z, i2.z, 1.0))
                    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                    + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                float n_ = 1.0/7.0;
                vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);
                vec4 x = x_ * ns.x + ns.yyyy;
                vec4 y = y_ * ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
                vec4 m = max(0.6 - vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
                m = m * m;
                return 42.0 * dot(m*m, vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
            }

            void main() {
                vUv = uv;
                vNormal = normal;

                // Displace vertices with noise
                float noise = snoise(position * uNoiseStrength + uTime * uNoiseSpeed);
                vec3 newPosition = position + normal * noise * 0.3;

                // Additional organic deformation
                float noise2 = snoise(position * 2.0 + uTime * uNoiseSpeed * 0.5);
                newPosition += normal * noise2 * 0.15;

                vPosition = newPosition;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float uTime;
            uniform vec3 uColor1;
            uniform vec3 uColor2;
            uniform vec3 uColor3;
            uniform vec3 uColor4;
            uniform vec3 uColor5;
            uniform vec3 uColor6;
            varying vec3 vPosition;
            varying vec3 vNormal;
            varying vec2 vUv;

            // Simplex noise for fragment
            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
            float snoise(vec3 v){
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod(i, 289.0);
                vec4 p = permute(permute(permute(
                    i.z + vec4(0.0, i1.z, i2.z, 1.0))
                    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                    + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                float n_ = 1.0/7.0;
                vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);
                vec4 x = x_ * ns.x + ns.yyyy;
                vec4 y = y_ * ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
                vec4 m = max(0.6 - vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
                m = m * m;
                return 42.0 * dot(m*m, vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
            }

            void main() {
                // Multi-color gradient based on position + time
                float gradient = (vPosition.y + 1.5) / 3.0;
                gradient = clamp(gradient + sin(uTime * 0.3) * 0.2, 0.0, 1.0);

                // Cloud-like noise pattern
                float cloudNoise = snoise(vPosition * 1.5 + uTime * 0.2);
                float cloudNoise2 = snoise(vPosition * 3.0 - uTime * 0.15);
                float cloudPattern = cloudNoise * 0.5 + cloudNoise2 * 0.3;

                // Mix 6 pastel colors based on gradient and noise
                vec3 color;
                if (gradient < 0.2) {
                    color = mix(uColor1, uColor2, gradient / 0.2);
                } else if (gradient < 0.4) {
                    color = mix(uColor2, uColor3, (gradient - 0.2) / 0.2);
                } else if (gradient < 0.6) {
                    color = mix(uColor3, uColor4, (gradient - 0.4) / 0.2);
                } else if (gradient < 0.8) {
                    color = mix(uColor4, uColor5, (gradient - 0.6) / 0.2);
                } else {
                    color = mix(uColor5, uColor6, (gradient - 0.8) / 0.2);
                }

                // Add cloud pattern
                color += cloudPattern * 0.15;

                // Fresnel edge glow
                vec3 viewDirection = normalize(cameraPosition - vPosition);
                float fresnel = pow(1.0 - abs(dot(viewDirection, vNormal)), 3.0);
                color += fresnel * vec3(0.3, 0.2, 0.5) * 0.8;

                // Iridescence shift
                float iridescence = sin(vPosition.x * 3.0 + uTime * 0.5) * 0.5 + 0.5;
                color = mix(color, color * 1.3, iridescence * 0.2);

                // Subtle inner glow
                float innerGlow = snoise(vPosition * 4.0 + uTime * 0.1) * 0.5 + 0.5;
                color += innerGlow * 0.05;

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // Pastel colors
        const color1 = new THREE.Color(0xff6b9d); // Hot pink
        const color2 = new THREE.Color(0xc44dff); // Electric purple
        const color3 = new THREE.Color(0x4dabf7); // Sky blue
        const color4 = new THREE.Color(0x51cf66); // Neon green
        const color5 = new THREE.Color(0xffd43b); // Sunny yellow
        const color6 = new THREE.Color(0xff922b); // Vibrant orange

        const blobGeometry = new THREE.IcosahedronGeometry(1.5, 128);
        const blobMaterial = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uNoiseStrength: { value: 0.8 },
                uNoiseSpeed: { value: 0.3 },
                uColor1: { value: color1 },
                uColor2: { value: color2 },
                uColor3: { value: color3 },
                uColor4: { value: color4 },
                uColor5: { value: color5 },
                uColor6: { value: color6 },
            },
        });

        const blob = new THREE.Mesh(blobGeometry, blobMaterial);
        scene.add(blob);

        // Ambient particles
        const particleCount = 300;
        const particleGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 3 + Math.random() * 4;
            positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = r * Math.cos(phi);
            particleSizes[i] = Math.random() * 3 + 1;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.03,
            color: 0xffffff,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending,
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // Lighting (subtle, shader handles most)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xff6b9d, 0.5, 20);
        pointLight1.position.set(3, 3, 3);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x4dabf7, 0.5, 20);
        pointLight2.position.set(-3, -3, -3);
        scene.add(pointLight2);

        // Animation
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            blobMaterial.uniforms.uTime.value = elapsed;

            // Slowly morph noise
            blobMaterial.uniforms.uNoiseStrength.value = 0.6 + Math.sin(elapsed * 0.3) * 0.3;

            // Rotate particles
            particles.rotation.y = elapsed * 0.05;
            particles.rotation.x = elapsed * 0.02;

            // Move lights
            pointLight1.position.x = Math.sin(elapsed * 0.5) * 5;
            pointLight1.position.z = Math.cos(elapsed * 0.5) * 5;
            pointLight2.position.x = Math.sin(elapsed * 0.3 + 2) * 5;
            pointLight2.position.z = Math.cos(elapsed * 0.3 + 2) * 5;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
